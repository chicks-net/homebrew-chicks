name: Brew Formula

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# global permissions
permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: Homebrew only supports macOS and Linux
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      HOMEBREW_NO_SANDBOX_LINUX: 1

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Homebrew (installs on Linux, updates on macOS)
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0 # master

      # Install just command runner
      - name: Install just
        run: brew install just
        shell: bash

      # Run the formula tests
      - name: Test chicks-text-tools formula
        run: just test-chicks-text-tools
        shell: bash
